[package]
name = "wingmankvm"
version = "2.0.0-rc.1"
edition = "2024"
# Minimum: let-chains (stable in 1.88) and dependencies such as webauthn-rs,
# image and time that declare rust-version 1.88. Verified with cargo test on
# 1.88.0; releases are built with 1.93.1 (see release.yml).
rust-version = "1.88"
license = "MIT"
description = "A lightweight, configurable ARM KVM service"

[dependencies]
anyhow = "1"
async-stream = "0.3"
argon2 = "0.5"
axum = { version = "0.8", features = ["form", "json", "multipart", "ws"] }
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
webrtc = "0.17.2"
webauthn-rs = "0.5"
sha2 = "0.10"
# WebAuthn's certificate validation depends on OpenSSL. Build it for the
# target architecture so ARM musl releases do not depend on host libraries.
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Temporary legacy-DTLS compatibility patch; provenance and removal criteria in vendor/dtls/PATCHES.md.
[patch.crates-io]
dtls = { path = "vendor/dtls" }
