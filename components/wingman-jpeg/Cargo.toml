[package]
name = "wingman-jpeg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Low-latency JPEG processing with exact ARM NEON RGB conversion"
publish = false

[dependencies]
jpeg-encoder = "=0.6.1"
moxcms = "=0.8.1"
zune-core = "=0.5.1"
zune-jpeg = "=0.5.15"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
