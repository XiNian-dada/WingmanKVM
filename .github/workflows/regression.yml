name: regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  # Versions exercised by the local regression environment.
  PLAYWRIGHT_VERSION: "1.58.0"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  regression:
    name: linux-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Official action commit verified by the coordinator.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify vendored terminal provenance and integrity
        run: python3 scripts/verify_xterm_vendor.py

      - name: Verify vendored dtls provenance and patches
        run: python3 scripts/verify_dtls_vendor.py

      - name: Verify one-line installer against a loopback fake release
        run: python3 scripts/verify_get_script.py

      - name: Verify installer mDNS helpers and setup URL
        run: python3 scripts/verify_mdns.py

      - name: Verify wingmankvm-doctor against fixture trees
        run: python3 scripts/verify_doctor.py

      - name: Install Node.js 22
        # Official action commit (actions/setup-node v7.1.0).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Lint frontend modules (ESLint, versions pinned in package-lock.json)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install eslint --max-warnings 0

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev linux-libc-dev libv4l-dev python3-venv

      - name: Install Rust 1.93.1
        run: |
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup default 1.93.1
          rustup show active-toolchain

      - name: Create Python venv and install pinned Playwright
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check \
            "playwright==${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium

      - name: Run Rust tests
        run: |
          cargo test --locked
          cargo test --locked -p dtls

      - name: Build debug binary
        run: cargo build --locked

      - name: Audit dependencies (gate)
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit --deny warnings

      - name: Run sequential HTTP/UI regression orchestrator
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/verify_regressions.py \
            --repo "$GITHUB_WORKSPACE" \
            --binary "$GITHUB_WORKSPACE/target/debug/wingmankvm" \
            --scratch-dir "$RUNNER_TEMP/wingmankvm-regressions" \
            --report "$RUNNER_TEMP/wingmankvm-reports/regressions.json" \
            --browser-channel chromium \
            --require-gate p2c_cookie \
            --require-gate p2c_upgrade

      - name: Build disposable privilege-test image from stdin
        run: |
          docker build -t wingmankvm-privilege-test - < scripts/fixtures/privilege.Dockerfile

      - name: Run permission boundary test in disposable container
        run: |
          mkdir -p "$RUNNER_TEMP/wingmankvm-privilege-reports"
          docker run --rm --network none \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/repo,readonly \
            --mount type=bind,src="$RUNNER_TEMP/wingmankvm-privilege-reports",dst=/reports \
            --workdir /repo \
            wingmankvm-privilege-test \
            python3 scripts/verify_p2c_privileges.py \
              --repo /repo --disposable-root --report /reports/privileges.json

      - name: Upload sanitized summary reports on failure
        if: failure()
        # Official action commit verified by the coordinator.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wingmankvm-regression-failure
          path: |
            ${{ runner.temp }}/wingmankvm-reports/regressions.json
            ${{ runner.temp }}/wingmankvm-privilege-reports/privileges.json
          if-no-files-found: warn
          retention-days: 7
