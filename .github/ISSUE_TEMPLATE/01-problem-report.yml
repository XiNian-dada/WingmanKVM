name: 问题与审查发现（P0–P3）
description: 报告可复现缺陷、审查发现或明确的工程风险，记录证据、原因、修复方向与验收标准。
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        请一项根因提交一个 issue，并先搜索已有问题。

        标题使用 **`[P级别][模块或审查编号] 具体问题`**，例如 `[P1][认证] 注销后终端连接仍可执行输入`。
        级别定义、标签规则和关闭标准见 [Issue 提交规范](https://github.com/XiNian-dada/WingmanKVM/blob/main/.github/ISSUE_GUIDELINES.md)。

        表单中的优先级是建议；维护者确认后应同步标题与唯一的 P0/P1/P2/P3 标签。
        日志、配置、截图和代码片段请移除真实密码、Cookie、令牌、私钥及无关个人数据。
  - type: dropdown
    id: priority
    attributes:
      label: 建议优先级
      description: 优先级体现处理顺序；置信度和是否复现应单独说明。
      options:
        - P0 — 严重事件，立即处置
        - P1 — 高风险，发布或扩大访问范围前处理
        - P2 — 明确风险，安排正常迭代修复
        - P3 — 低风险，维护整理
      default: 2
    validations:
      required: true
  - type: dropdown
    id: verification_status
    attributes:
      label: 证据状态
      options:
        - Confirmed — 已复现，或代码调用链可明确确认
        - Suspected — 尚需补充验证
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: 置信度
      options:
        - High — 直接行为或明确代码证据
        - Medium — 条件、平台或环境仍需复核
        - Low — 线索不足，先核验
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要模块
      options:
        - 认证 / 会话 / 权限
        - 配置 / 数据完整性
        - 视频 / 编码 / WebRTC
        - HID / 键鼠
        - GPIO / 电源
        - 虚拟介质 / 上传
        - 前端状态 / 可访问性
        - 部署 / 发布 / 供应链
        - 测试 / 可观测性
        - 文档 / 可维护性
        - 其他（在描述中说明）
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题简述
      description: 描述谁在什么条件下遇到什么问题，以及直接影响。
      placeholder: 在……条件下执行……，实际出现……，导致……。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本、环境与影响范围
      description: 明确审查或复现的版本基线；本地未发布提交必须注明，不要将行号误指向默认分支。
      value: |
        - 版本 / commit：
        - 操作系统 / 架构：
        - 板卡、内核与相关硬件（如适用）：
        - 浏览器 / 反向代理 / 部署方式（如适用）：
        - 影响模块和用户：
        - 前置权限与触发条件：
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现条件与步骤
      description: 给出最小可重复步骤；仅静态审查时说明如何沿调用链核验，不要把未执行的实验写成已经复现。
      value: |
        前置条件：

        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期结果与实际结果
      value: |
        **预期结果：**

        **实际结果：**

        **发生频率 / 观测样本：**
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 代码、日志或测试证据
      description: 优先提供固定 commit 的代码链接、路径与行号、函数名、脱敏日志或失败测试；注明采集时间。
      placeholder: |
        - 文件 / 函数 / 行号：
        - 固定 commit 链接或本地基线说明：
        - 最小代码片段 / 调用链：
        - 实际执行的验证与结果：
        - 尚未验证的部分：
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: 具体原因分析
      description: 连接输入、状态变化和错误结果；未知时写明未知及需要验证的假设。
      placeholder: 原因是……。路径 A → B → C 在……边界缺少……，从而导致……。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 解决方案方向
      description: 先写最小可行修复，再列可选后续方案、兼容性和变更风险；不要求提交者已经实现。
      value: |
        **最小修复：**

        **可选后续改进：**

        **兼容性 / 回滚考虑：**
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可观察、可验证的清单；将下面的通用条目具体化为本问题的行为。
      value: |
        - [ ] 原复现条件下得到预期行为。
        - [ ] 正常路径与权限边界没有回归。
        - [ ] 相关回归测试覆盖本次根因。
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: 回归测试建议
      description: 写明测试层级、输入、预期断言，以及哪些内容必须在 Linux 或真实硬件验证。
      placeholder: |
        - 自动化用例：
        - 关键断言：
        - Linux / 硬件验证（如适用）：
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: 工作量、依赖与关联
      description: 不清楚时可写待评估；不要凭空承诺发布日期或指定负责人。
      value: |
        - 预计工作量：待评估
        - 前置依赖 / 关联 issue：
        - 原始审查报告 / AUD 编号（如适用）：
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 issue，并在重复或相关问题处提供关联。
          required: true
        - label: 我已区分实际验证、静态推导和待确认假设。
          required: true
        - label: 本 issue 不包含真实密码、会话令牌、私钥或无关个人数据。
          required: true
